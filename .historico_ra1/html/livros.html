<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Cadastro de Livros</title>
</head>
<body>
    <script src="livros.js"></script>
    <header class="d-flex justify-content-center py-3"> 
        <ul class="nav nav-pills"> 
            <li class="nav-item"><a href="serie.html" class="nav-link">Serie</a></li> 
            <li class="nav-item"><a href="livros.html" class="nav-link">Livros</a></li> 
            <li class="nav-item"><a href="games.html" class="nav-link">Games</a></li> 
            <li class="nav-item"><a href="filmes.html" class="nav-link">Filme</a></li> 
            <li class="nav-item"><a href="artigos.html" class="nav-link">Artigos</a></li> 
        </ul> 
    </header>

    <form> 
        <h1 class="h3 mb-3 fw-normal">Cadastro de Livro</h1> 
        <div class="form-floating"> <input type="text" class="form-control" id="titulo_livro" placeholder="titulo_livro"> 
            <label for="titulo_livro">Titúlo do Livro</label> 
        </div> 
        <br>
        <div class="form-floating"> 
            <input type="text" class="form-control" placeholder="Autor" id="autor_livro"> 
            <label for="autor_livro">Autor</label> 
        </div> 
        <br>
        <div class="form-floating mb-2">
            <input type="text" class="form-control" id="genero_livro" placeholder="Gênero do Livro">
            <label for="genero_livro">Gênero do Livro</label>
        </div>
        <br>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="editora_livro" placeholder="Editora">
            <label for="editora_livro">Editora</label>
        </div>
        <!-- Elemento para mensagens de erro/validação -->
        <p id="msgForm" class="text-danger fw-bold my-2"></p>
        <!-- Botões de ação -->
        <button class="btn btn-primary w-100 py-2" type="button" id="cadastro">Cadastrar Livro</button>
        <button class="btn btn-success w-100 py-2 mt-2" type="button" id="btnSalvar" style="display: none;">Salvar Alterações</button>
    </form>
    
    <div id="listalivros" class="mt-4"></div>
    <div id="listalivros">

    </div>
</body>
</html>
