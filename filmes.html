<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome: necessário para os ícones usados dentro do filmes.js (fa-film, fa-pen, fa-trash) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Cadastro de Filmes</title>
</head>
<body>
    <header class="d-flex justify-content-center py-3">
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="#" class="nav-link">Usuário</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Livros</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Games</a></li>
            <li class="nav-item"><a href="filmes.html" class="nav-link">Filme</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Artigos</a></li>
        </ul>
    </header>

    <form>
        <h1 class="h3 mb-3 fw-normal">Cadastro de Filmes</h1>
        <div class="form-floating">
            <input type="text" class="form-control" id="nomeFilme" placeholder="Shrek">
            <label for="nomeFilme">Nome do filme</label>
        </div>

        <div class="form-floating">
            <input type="date" class="form-control" id="anoFilme">
            <label for="anoFilme">Data de lançamento</label>
        </div>

        <div class="form-floating">
            <input type="text" class="form-control" id="diretorFilme" placeholder="Diretor">
            <label for="diretorFilme">Diretor</label>
        </div>

        <div class="form-floating">
            <input type="text" class="form-control" id="generoFilme" placeholder="Gênero">
            <label for="generoFilme">Gênero</label>
        </div>

        <div class="form-floating">
            <input type="text" class="form-control" id="idiomaFilme" placeholder="Idioma">
            <label for="idiomaFilme">Idioma</label>
        </div>

        <div id="msgForm" class="text-danger mb-2"></div>

        <button class="btn btn-success w-100 py-2 mt-2" type="button" id="btnSalvar" style="display: none;">
            Salvar Alterações
        </button>

        <button class="btn btn-primary w-100 py-2" type="button" id="btnAdicionar">Cadastrar Filme</button>
    </form>

    <div id="listaFilmes" class="mt-4"></div>

    <script src="filmes.js"></script>
</body>
</html>
