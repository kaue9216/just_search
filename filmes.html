    <form> 
        <h1 class="h3 mb-3 fw-normal">Cadastro de Filmes</h1> 
        <div class="form-floating"> <input type="text" class="form-control" id="nomeFilme" placeholder="Shrek"> 
            <label for="floatingInput">Nome do filme</label> 
        </div> 
        <div class="form-floating"> 
            <input type="date" class="form-control" id="anoFilme" placeholder="Anodelancamento"> <label for="floatingPassword">Ano de lançamento</label> 
        </div> 
        <div class="form-floating"> 
            <input type="text" class="form-control" id="diretorFilme" placeholder="Diretor"> <label for="floatingDiretor">Diretor</label>
        </div> 
        <div class="form-floating"> 
            <input type="text" class="form-control" id="generoFilme" placeholder="Genero"> <label for="floatingGenero">Gênero</label>
        </div> 
        <div class="form-floating"> 
            <input type="text" class="form-control" id="idiomaFilme" placeholder="Idioma"> <label for="floatingIdioma">Idioma</label>
        </div> 
        <div id="msgForm" class="text-danger text-center mb-3"></div>
            <button id="btnAdicionar" class="btn btn-primary w-100 py-2 mb-2" type="button">Cadastrar</button>
        
        <button id="btnSalvar" class="btn btn-success w-100 py-2" type="button" style="display: none;">Salvar Edição</button>
    </form>

        <div id="listaFilmes" class="mt-4"></div>
