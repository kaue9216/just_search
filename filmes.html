<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Cadastro de Filmes</title>
</head>
<body>
    <header class="d-flex justify-content-center py-3"> 
        <ul class="nav nav-pills"> 
            <li class="nav-item"><a href="#" class="nav-link">Usuário</a></li> 
            <li class="nav-item"><a href="#" class="nav-link">Livros</a></li> 
            <li class="nav-item"><a href="games.html" class="nav-link">Games</a></li> 
            <li class="nav-item"><a href="filmes.html" class="nav-link">Filme</a></li> 
            <li class="nav-item"><a href="#" class="nav-link">Artigos</a></li> 
        </ul> 
    </header>

    <form> 
        <h1 class="h3 mb-3 fw-normal">Cadastro de Filmes</h1> 
        <div class="form-floating"> <input type="text" class="form-control" id="floatingInput" placeholder="Shrek"> 
            <label for="floatingInput">Nome do filme</label> 
        </div> 
        <div class="form-floating"> 
            <input type="date" class="form-control" id="floatingPassword" placeholder="Anodelancamento"> <label for="floatingPassword">Ano de lançamento</label> 
        </div> 
        <div class="form-floating"> 
            <input type="text" class="form-control" id="floatingDiretor" placeholder="Diretor"> <label for="floatingDiretor">Diretor</label>
        </div> 
        <div class="form-floating"> 
            <input type="text" class="form-control" id="floatingGenero" placeholder="Genero"> <label for="floatingGenero">Gênero</label>
        </div> 
        <div class="form-floating"> 
            <input type="text" class="form-control" id="floatingIdioma" placeholder="Idioma"> <label for="floatingIdioma">Idioma</label>
        </div> 
        <button class="btn btn-primary w-100 py-2" type="submit">Cadastrar</button>
    </form>
    
</body>
</html>
