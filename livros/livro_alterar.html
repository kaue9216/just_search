<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro ALTERAR - JustSearch</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="brand-header">
            <div class="logo-box">
                <span class="logo-badge">JS</span>
                <span class="logo-text">JustSearch</span>
            </div>
        </header>

        <main class="main-card form-card">
            <h2 class="card-header-title">Alterar Livro</h2>

            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" class="form-control" placeholder="título. . .">
            </div>

            <div class="form-group">
                <label for="autor">Autor</label>
                <input type="text" id="autor" class="form-control" placeholder="autor. . .">
            </div>

            <div class="form-group">
                <label for="editora">Editora</label>
                <input type="text" id="editora" class="form-control" placeholder="editora. . .">
            </div>

            <div class="form-group">
                <label for="ano">Ano</label>
                <input type="number" id="ano" class="form-control" placeholder="ano. . .">
            </div>

            <div class="form-group">
                <label for="genero">Gênero</label>
                <input type="text" id="genero" class="form-control" placeholder="gênero. . .">
            </div>

            <div class="form-group">
                <label for="numero_paginas">Número de páginas</label>
                <input type="number" id="numero_paginas" class="form-control" placeholder="páginas. . .">
            </div>

            <input type="hidden" id="id">

            <div class="form-actions">
                <button id="enviar" class="btn btn-primary">Enviar</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='index_livros.html'">Voltar</button>
            </div>
        </main>
    </div>

    <script src="../js/valida_sessao.js"></script>
    <script src="../js/livro_alterar.js"></script>
</body>
</html>
