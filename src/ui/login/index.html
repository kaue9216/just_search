<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JustSearch</title>
    
<!--CSS Bootstrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="background-color: #1e1e2f;">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        
<!-- Div do card interno -->
        <div class="card p-4 bg-dark text-white shadow-lg" style="width: 100%; max-width: 400px; border-radius: 5%;">
            <h1 class="text-center h3 mb-4 fw-bold">JustSearch</h1>
            <form>
<!-- Campo de Usuário e e-mail -->
                <div class="mb-3">
                    <label for="usuario" class="form-label fw-semibold">Usuário ou e-mail</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="usuario" 
                        placeholder="Digite seu usuário ou e-mail" 
                        required
                    >
                </div>

<!-- Campo Senha + esqueceu senha -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="senha" class="form-label fw-semibold mb-0">Senha</label>
                        <a href="#" class="text-decoration-none small text-primary">Esqueceu sua senha?</a>
                    </div>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="senha" 
                        placeholder="Digite sua senha" 
                        required
                    >
                </div>

<!-- Botão Entrar -->
                <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
            </form>
        </div>
    </div>

<!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
