<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Administração</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
        }
        .navbar-petshop {
            background: #0369a1;
            padding: 14px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .navbar-petshop .brand {
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .navbar-petshop .usuario-info {
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
        }
        .btn-sair {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            padding: 4px 14px;
            font-size: 0.85rem;
        }
        .btn-sair:hover {
            background: rgba(255,255,255,0.28);
            color: white;
        }
        .card-painel {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0369a1;
            margin-bottom: 18px;
            border-bottom: 2px solid #e0f2fe;
            padding-bottom: 8px;
        }
        .table th {
            background: #0369a1;
            color: white;
            font-size: 0.88rem;
        }
        .table td {
            vertical-align: middle;
            font-size: 0.9rem;
        }
        .badge-status {
            font-size: 0.78rem;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-aguardando     { background: #fef9c3; color: #854d0e; }
        .status-em_atendimento { background: #dbeafe; color: #1e40af; }
        .status-pronto         { background: #dcfce7; color: #166534; }
        .status-entregue       { background: #f3f4f6; color: #374151; }
        .btn-status {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 5px;
            white-space: nowrap;
        }
        .filtro-bar {
            background: #e0f2fe;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>

<nav class="navbar-petshop">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="brand">
            <i class="fa-solid fa-paw me-2"></i>PetShop
            <small style="font-size:0.7rem;opacity:0.8;margin-left:6px;">ADMIN</small>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="usuario-info" id="nomeUsuario"></span>
            <button type="button" class="btn-sair" onclick="sair()">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Sair
            </button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- CARDS DE RESUMO -->
    <div class="row g-3 mb-4" id="cardsResumo"></div>

    <!-- TABELA DE TODOS OS ANIMAIS -->
    <div class="card card-painel p-4">
        <div class="section-title">
            <i class="fa-solid fa-clipboard-list me-1"></i> Todos os Animais
        </div>

        <!-- FILTRO DE STATUS -->
        <div class="filtro-bar d-flex align-items-center gap-2 flex-wrap">
            <span class="fw-semibold text-secondary me-2">
                <i class="fa-solid fa-filter me-1"></i>Filtrar:
            </span>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="filtrar('todos')">Todos</button>
            <button type="button" class="btn btn-sm btn-warning"   onclick="filtrar('aguardando')">Aguardando</button>
            <button type="button" class="btn btn-sm btn-primary"   onclick="filtrar('em_atendimento')">Em Atendimento</button>
            <button type="button" class="btn btn-sm btn-success"   onclick="filtrar('pronto')">Pronto</button>
            <button type="button" class="btn btn-sm btn-secondary" onclick="filtrar('entregue')">Entregue</button>
        </div>

        <div id="listaAnimais"></div>
    </div>

</div>

<script src="admin.js"></script>
</body>
</html>
