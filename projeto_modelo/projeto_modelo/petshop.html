<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Meus Animais</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: #f8fafc;
            min-height: 100vh;
        }
        .navbar-petshop {
            background: #0369a1;
            padding: 14px 0;
        }
        .navbar-petshop .brand {
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .navbar-petshop .usuario-info {
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
        }
        .btn-sair {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            padding: 4px 14px;
            font-size: 0.85rem;
        }
        .btn-sair:hover {
            background: rgba(255,255,255,0.28);
            color: white;
        }
        .card-form {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0369a1;
            margin-bottom: 18px;
            border-bottom: 2px solid #e0f2fe;
            padding-bottom: 8px;
        }
        .table th {
            background: #0369a1;
            color: white;
            font-size: 0.88rem;
        }
        .table td {
            vertical-align: middle;
            font-size: 0.9rem;
        }
        .badge-status {
            font-size: 0.78rem;
            padding: 5px 10px;
            border-radius: 20px;
        }
        .status-aguardando { background: #fef9c3; color: #854d0e; }
        .status-em_atendimento { background: #dbeafe; color: #1e40af; }
        .status-pronto { background: #dcfce7; color: #166534; }
        .status-entregue { background: #f0fdf4; color: #14532d; }
        .btn-acao {
            font-size: 0.8rem;
            padding: 3px 9px;
            border-radius: 5px;
        }
        #btnSalvar { display: none; }
        .animal-icon { font-size: 1.1rem; }
    </style>
</head>
<body>

<nav class="navbar-petshop">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="brand">
            <i class="fa-solid fa-paw me-2"></i>PetShop
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="usuario-info" id="nomeUsuario"></span>
            <button type="button" class="btn-sair" onclick="sair()">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Sair
            </button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- FORMULÁRIO DE CADASTRO DE ANIMAL -->
    <div class="card card-form p-4 mb-4">
        <div class="section-title">
            <i class="fa-solid fa-plus me-1"></i> Cadastrar Animal
        </div>
        <div class="row g-3">
            <div class="col-md-4">
                <label for="nomeAnimal" class="form-label">Nome do Animal</label>
                <input type="text" class="form-control" id="nomeAnimal" placeholder="Ex: Rex">
            </div>
            <div class="col-md-3">
                <label for="especie" class="form-label">Espécie</label>
                <select class="form-select" id="especie">
                    <option value="">Selecione</option>
                    <option value="Cachorro">🐕 Cachorro</option>
                    <option value="Gato">🐈 Gato</option>
                    <option value="Pássaro">🦜 Pássaro</option>
                    <option value="Coelho">🐇 Coelho</option>
                    <option value="Peixe">🐟 Peixe</option>
                    <option value="Outro">🐾 Outro</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="raca" class="form-label">Raça</label>
                <input type="text" class="form-control" id="raca" placeholder="Ex: Labrador">
            </div>
            <div class="col-md-2">
                <label for="servico" class="form-label">Serviço</label>
                <select class="form-select" id="servico">
                    <option value="Banho">Banho</option>
                    <option value="Tosa">Tosa</option>
                    <option value="Banho + Tosa">Banho + Tosa</option>
                    <option value="Consulta">Consulta</option>
                    <option value="Vacinação">Vacinação</option>
                </select>
            </div>
        </div>
        <div class="mt-3 d-flex gap-2 align-items-center">
            <button type="button" class="btn btn-primary" id="btnAdicionar">
                <i class="fa-solid fa-plus me-1"></i> Adicionar
            </button>
            <button type="button" class="btn btn-success" id="btnSalvar">
                <i class="fa-solid fa-floppy-disk me-1"></i> Salvar Alteração
            </button>
            <span id="msgForm" class="text-danger ms-2"></span>
        </div>
    </div>

    <!-- TABELA DE ANIMAIS -->
    <div class="card card-form p-4">
        <div class="section-title">
            <i class="fa-solid fa-list me-1"></i> Meus Animais
        </div>
        <div id="listaAnimais"></div>
    </div>

</div>

<script src="petshop.js"></script>
</body>
</html>
