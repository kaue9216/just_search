    <!-- FORMULÁRIO DE CASDASTRO DE ARTIGOS -->
    <div class="artigo">
        <div class="">
            <i class=""></i>Cadastrar um artigo
        </div>
            <div class="">
            <div class="">
                <label for="nomeArtigo" class="">Nome do Artigo</label>
                <input type="text" class="form-control" id="txt-nomeArtigo" placeholder="Escolha um nome para o seu artigo">
            </div>
            <div class="">
                <label for="Categoria" class="form-label">Categoria</label>
                <select class="form-select" id="Categoria">
                    <option value="">Selecione</option>
                    <option value="Científico">Científico</option>
                    <option value="Acadêmico">Acadêmico</option>
                </select>
            </div>
            <div class="">
                <label for="DescricaoArtigo" class="form-label">Síntese</label>
                <input type="text" class="form-control" id="DescricaoArtigo" placeholder="Escreva uma breve introdução sobre o seu artigo">
            </div>
            <div class="">
                <label for="Privacidade" class="form-label">Privacidade</label>
                <select class="form-select" id="Privacidade">
                    <option value="Público">Público</option>
                    <option value="Privado">Privado</option>
                </select>
            </div>
        </div>
        <div class="">
            <button type="button" class="btn-primary" id="btnAdicionar">
                <i class=""></i> Adicionar
            </button>
            <button type="button" class="btn-success" id="btnSalvar">
                <i class=""></i> Salvar Alteração
            </button>
            <span id="msgForm" class=""></span>
        </div>
    </div>
    <div class="mt-4" id="listaArtigos"></div>
    <script src="artigos.js"></script>
