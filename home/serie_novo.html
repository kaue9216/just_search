<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Série NOVO - JustSearch</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topo">
        <a class="logo" href="index_series.html">
            <span class="logo-marca">JS</span>
            <span class="logo-nome">JustSearch</span>
        </a>
        <nav class="menu">
            <a class="btn btn-secundario" href="index_series.html">Voltar</a>
        </nav>
    </header>

    <main class="formulario formulario-estreito">
        <h2>Cadastre uma série:</h2>

        <div class="campos">
            <div class="campo">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" placeholder="título...">
            </div>
            <div class="campo">
                <label for="autor">Autor:</label>
                <input type="text" id="autor" placeholder="autor...">
            </div>
            <div class="campo">
                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" placeholder="categoria...">
            </div>
            <div class="campo">
                <label for="ano">Ano:</label>
                <input type="number" id="ano" placeholder="ano...">
            </div>
        </div>

        <div class="form-acoes">
            <button class="btn" id="enviar">Enviar</button>
        </div>
    </main>

    <script src="../js/serie_novo.js"></script>
</body>
</html>
