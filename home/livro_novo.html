<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro NOVO - JustSearch</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topo">
        <a class="logo" href="index_livros.html">
            <span class="logo-marca">JS</span>
            <span class="logo-nome">JustSearch</span>
        </a>
        <nav class="menu">
            <a class="btn btn-secundario" href="index_livros.html">Voltar</a>
        </nav>
    </header>

    <main class="formulario formulario-estreito">
        <h2>Cadastre um livro:</h2>

        <form id="form">
        <div class="campos">
            <div class="campo">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" placeholder="título...">
            </div>
            <div class="campo">
                <label for="autor">Autor:</label>
                <input type="text" id="autor" name="autor" placeholder="autor...">
            </div>
            <div class="campo">
                <label for="editora">Editora:</label>
                <input type="text" id="editora" name="editora" placeholder="editora...">
            </div>
            <div class="campo">
                <label for="ano">Ano:</label>
                <input type="number" id="ano" name="ano" placeholder="ano...">
            </div>
            <div class="campo">
                <label for="genero">Gênero:</label>
                <input type="text" id="genero" name="genero" placeholder="gênero...">
            </div>
            <div class="campo">
                <label for="numero_paginas">Páginas:</label>
                <input type="number" id="numero_paginas" name="numero_paginas" placeholder="páginas...">
            </div>
        </div>

        <div class="form-acoes">
            <button type="button" class="btn" id="enviar">Enviar</button>
        </div>
        </form>
    </main>

    <script src="../js/livro_novo.js"></script>
</body>
</html>
